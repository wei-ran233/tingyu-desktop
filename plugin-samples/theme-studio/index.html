const buttons=Array.from(document.querySelectorAll('.choice'));
function select(id){const p=profiles.find(p=>p.id===id);document.body.dataset.theme=id;for(const [key,value]of Object.entries({bg:p.background,surface:p.surface,text:p.text,accent:p.color}))document.body.style.setProperty('--'+key,value);buttons.forEach(b=>{const selected=b.dataset.theme===id;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1});document.getElementById('preview').setAttribute('aria-labelledby','tab-'+id);document.getElementById('screen').src=p.image;document.getElementById('screen').alt=p.name+'主题的真实资料库界面';document.getElementById('caption').textContent=p.caption;document.getElementById('description').textContent=p.description;document.getElementById('details').replaceChildren(...p.details.map(text=>{const el=document.createElement('span');el.textContent=text;return el}))}
buttons.forEach((b,index)=>{b.addEventListener('click',()=>select(b.dataset.theme));b.addEventListener('keydown',event=>{let i;if(event.key==='ArrowRight'||event.key==='ArrowDown')i=(index+1)%3;else if(event.key==='ArrowLeft'||event.key==='ArrowUp')i=(index+2)%3;else if(event.key==='Home')i=0;else if(event.key==='End')i=2;else return;event.preventDefault();select(buttons[i].dataset.theme);buttons[i].focus()})});document.querySelector('.motion').addEventListener('click',event=>{const off=document.body.dataset.motion!=='off';document.body.dataset.motion=off?'off':'on';event.currentTarget.textContent=off?'开启预览动效':'关闭预览动效';event.currentTarget.setAttribute('aria-pressed',String(!off))});select('tide');
</script></body></html>
